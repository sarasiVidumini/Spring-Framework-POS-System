<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex POS - Intelligence Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/Frontend/Styles/dashboard.css" />
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <i class="fas fa-rocket"></i><span>Vortex POS</span>
  </div>
  <nav class="nav-menu">
    <a href="index.html" class="nav-item active">
      <i class="fas fa-grip-vertical"></i> Dashboard
    </a>
    <a href="customer.html" class="nav-item">
      <i class="fas fa-users-rectangle"></i> Customers
    </a>
    <a href="item.html" class="nav-item">
      <i class="fas fa-cubes"></i> Inventory
    </a>
    <a href="order.html" class="nav-item">
      <i class="fas fa-wallet"></i> New Sale
    </a>
  </nav>
</aside>

<main class="main">
  <header>
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search analytics or invoices..." />
    </div>
    <div class="profile-chip">
      <div class="profile-info">
        <span class="user-name">Sarasi</span>
        <span class="user-role">Administrator</span>
      </div>
      <img src="https://ui-avatars.com/api/?name=Thilina&background=10b981&color=fff" alt="Profile" />
    </div>
  </header>

  <div class="container">
    <div class="welcome-section">
      <h1>Welcome... !</h1>
      <p>Insightful overview of your commercial performance today.</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-content">
          <p class="stat-label">Total Revenue</p>
          <h2 class="stat-value">Rs. 142,500</h2>
          <span class="stat-trend up"><i class="fas fa-arrow-up"></i> 12% vs last month</span>
        </div>
        <div class="stat-icon-box bg-emerald">
          <i class="fas fa-chart-line"></i>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-content">
          <p class="stat-label">New Customers</p>
          <h2 class="stat-value">42</h2>
          <span class="stat-trend"><i class="fas fa-user-group"></i> Active Base</span>
        </div>
        <div class="stat-icon-box bg-indigo">
          <i class="fas fa-user-plus"></i>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-content">
          <p class="stat-label">Inventory Alerts</p>
          <h2 class="stat-value">12</h2>
          <span class="stat-trend down"><i class="fas fa-triangle-exclamation"></i> Low stock items</span>
        </div>
        <div class="stat-icon-box bg-amber">
          <i class="fas fa-boxes-stacked"></i>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
