<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex POS - Inventory Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/Frontend/Styles/item.css" />
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <i class="fas fa-rocket"></i><span>Vortex POS</span>
  </div>
  <nav class="nav-menu">
    <a href="index.html" class="nav-item">
      <i class="fas fa-grip-vertical"></i> Dashboard
    </a>
    <a href="customer.html" class="nav-item">
      <i class="fas fa-users-rectangle"></i> Customers
    </a>
    <a href="item.html" class="nav-item active">
      <i class="fas fa-cubes"></i> Inventory
    </a>
    <a href="order.html" class="nav-item">
      <i class="fas fa-wallet"></i> New Sale
    </a>
  </nav>
</aside>

<main class="main">
  <header>
    <div class="breadcrumb">
      Warehouse / <strong>Inventory</strong>
    </div>
    <div class="user-tag">Hello 👋</div>
  </header>

  <div class="container">
    <div class="page-header">
      <div>
        <h1>Product Stock</h1>
        <p>Track and manage your products stock levels in real-time.</p>
      </div>
      <button class="btn btn-primary" onclick="openModal('add')">
        <i class="fas fa-plus-circle"></i> Add New Item
      </button>
    </div>

    <div class="glass-card">
      <div class="table-container">
        <table>
          <thead>
          <tr>
            <th>Item Code</th>
            <th>Description</th>
            <th>Unit Price</th>
            <th>Qty On Hand</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody id="itemTable">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Stock Registration</h2>
      <i class="fas fa-xmark close-icon" onclick="closeModal()"></i>
    </div>
    <div class="form-body">
      <div class="form-group">
        <label>Item Identification Code</label>
        <input type="text" id="itemCode" placeholder="e.g. I001" />
      </div>
      <div class="form-group">
        <label>Product Description</label>
        <input type="text" id="itemDescription" placeholder="Product name or details" />
      </div>
      <div class="form-group">
        <label>Unit Price (LKR)</label>
        <input type="number" id="ItemUnitPrice" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label>Quantity On Hand</label>
        <input type="number" id="itemQty" placeholder="0" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel Action</button>
      <button id="actionBtn" class="btn btn-primary">Save to Inventory</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/Frontend/Script/item.js"></script>
</body>
</html>
