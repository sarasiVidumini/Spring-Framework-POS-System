<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextGen POS - Inventory</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/Styles/item.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <i class="fas fa-bolt"></i><span>NextGen POS</span>
      </div>
      <nav class="nav-menu">
        <a href="/Pages/index.html" class="nav-item"
          ><i class="fas fa-th-large"></i> Dashboard</a
        >
        <a href="/Pages/customer.html" class="nav-item"
          ><i class="fas fa-user-group"></i> Customers</a
        >
        <a href="/Pages/item.html" class="nav-item active"
          ><i class="fas fa-box-archive"></i> Inventory</a
        >
        <a href="order.html" class="nav-item"
          ><i class="fas fa-receipt"></i> New Sale</a
        >
      </nav>
    </aside>

    <main class="main">
      <header>
        <div
          class="breadcrumb"
          style="color: var(--secondary); font-size: 14px"
        >
          Pages / Inventory
        </div>
        <div style="font-weight: 600; font-size: 14px">Thilina 👋</div>
      </header>

      <div class="container">
        <div class="page-header">
          <div>
            <h1 style="font-size: 28px; font-weight: 700">Inventory</h1>
            <p style="color: var(--secondary); margin-top: 4px">
              Track and manage your products stock levels.
            </p>
          </div>
          <button class="btn btn-primary" onclick="openModal('add')">
            <i class="fas fa-plus"></i> Add New Item
          </button>
        </div>

        <div class="glass-card">
          <table>
            <thead>
              <tr>
                <th>Item Code</th>
                <th>Description</th>
                <th>Unit Price</th>
                <th>Qty On Hand</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="itemTable"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle" style="font-weight: 700">Add Item</h2>
          <i
            class="fas fa-times"
            style="cursor: pointer; color: var(--secondary)"
            onclick="closeModal()"
          ></i>
        </div>
        <div class="form-body">
          <div class="form-group">
            <label>Item Code</label>
            <input type="text" id="itemCode" placeholder="e.g. I001" />
          </div>
          <div class="form-group">
            <label>Description</label>
            <input
              type="text"
              id="itemDescription"
              placeholder="Product name/details"
            />
          </div>
          <div class="form-group">
            <label>Unit Price</label>
            <input type="number" id="ItemUnitPrice" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label>Qty On Hand</label>
            <input type="number" id="itemQty" placeholder="0" />
          </div>
        </div>
        <div class="modal-footer">
          <button
            class="btn"
            style="background: var(--border); flex: 1"
            onclick="closeModal()"
          >
            Cancel
          </button>
          <button id="actionBtn" class="btn btn-primary" style="flex: 2">
            Save Item
          </button>
        </div>
      </div>
    </div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script src="/Script/item.js"></script>
  </body>
</html>
