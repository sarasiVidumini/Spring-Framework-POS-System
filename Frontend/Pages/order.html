<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex POS - Point of Sale</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/Frontend/Styles/order.css" />
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <i class="fas fa-rocket"></i><span>Vortex POS</span>
  </div>
  <nav class="nav-menu">
    <a href="index.html" class="nav-item">
      <i class="fas fa-grip-vertical"></i> Dashboard
    </a>
    <a href="customer.html" class="nav-item">
      <i class="fas fa-users-rectangle"></i> Customers
    </a>
    <a href="item.html" class="nav-item">
      <i class="fas fa-cubes"></i> Inventory
    </a>
    <a href="order.html" class="nav-item active">
      <i class="fas fa-wallet"></i> New Sale
    </a>
  </nav>
</aside>

<main class="main">
  <header>
    <div class="breadcrumb">Terminal / <strong>New Order</strong></div>
    <div class="order-id-badge">
      Order ID: <span id="orderIdDisplay">#ORD-000</span>
    </div>
  </header>

  <div class="container">
    <div class="order-grid">
      <div class="glass-card">
        <h3 class="card-title"><i class="fas fa-user-circle"></i> Customer Selection</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Find Customer ID</label>
            <select id="selectCustomer">
              <option value="">Select Customer</option>
            </select>
          </div>
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="custName" readonly class="readonly-input" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Transaction Date</label>
            <input type="date" id="orderDate" />
          </div>
          <div class="form-group">
            <label>Primary Address</label>
            <input type="text" id="custAddress" readonly class="readonly-input" />
          </div>
        </div>
      </div>

      <div class="glass-card">
        <h3 class="card-title"><i class="fas fa-shopping-basket"></i> Item Selection</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Product Code</label>
            <select id="selectItem">
              <option value="">Select Item</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" id="itemDesc" readonly class="readonly-input" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Price (LKR)</label>
            <input type="text" id="itemPrice" readonly class="readonly-input price-text" />
          </div>
          <div class="form-group">
            <label>Available Stock</label>
            <input type="text" id="qtyOnHand" readonly class="readonly-input stock-badge" />
          </div>
        </div>
        <div class="form-row align-end">
          <div class="form-group">
            <label class="highlight-label">Order Quantity</label>
            <input type="number" id="orderQty" placeholder="0" class="qty-input" />
          </div>
          <button class="btn btn-add">
            <i class="fas fa-cart-plus"></i> Add To Cart
          </button>
        </div>
      </div>
    </div>

    <div class="order-grid-bottom">
      <div class="glass-card table-card">
        <div class="table-container">
          <table>
            <thead>
            <tr>
              <th>Code</th>
              <th>Description</th>
              <th>Unit Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th style="text-align: center;">Action</th>
            </tr>
            </thead>
            <tbody id="orderTableBody">
            </tbody>
          </table>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-header">Order Summary</div>
        <div class="total-section">
          <span class="total-label">Grand Total</span>
          <span class="total-value" id="grandTotal">Rs. 0.00</span>
        </div>
        <div class="discount-section">
          <label>Applied Discount (%)</label>
          <input type="number" id="discount" value="0" />
        </div>
        <button class="btn btn-place-order">
          Complete Transaction <i class="fas fa-arrow-right-long"></i>
        </button>
      </div>
    </div>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/Frontend/Script/order.js"></script>
</body>
</html>
